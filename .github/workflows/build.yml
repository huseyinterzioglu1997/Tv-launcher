name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Projekt erzeugen
        run: |
          set -e
          mkdir -p app/src/main/java/com/ht/launcher app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "tv-launcher"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.ht.launcher"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.ht.launcher"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:banner="@drawable/banner"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/ht/launcher/MainActivity.kt <<'EOF'
          package com.ht.launcher

          import android.app.Activity
          import android.content.Intent
          import android.graphics.drawable.Drawable
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView

          data class AppItem(
              val label: String,
              val icon: Drawable,
              val isBanner: Boolean,
              val intent: Intent
          )

          class MainActivity : Activity() {

              private lateinit var list: RecyclerView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  list = findViewById(R.id.apps)
                  list.layoutManager = GridLayoutManager(this, 5)
              }

              override fun onResume() {
                  super.onResume()
                  list.adapter = AppAdapter(loadApps()) { startApp(it) }
              }

              private fun startApp(item: AppItem) {
                  try {
                      startActivity(item.intent)
                  } catch (e: Exception) {
                      Toast.makeText(this, "Uygulama acilamadi", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun loadApps(): List<AppItem> {
                  val pm = packageManager
                  val result = LinkedHashMap<String, AppItem>()
                  val categories = listOf(Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER)
                  for (category in categories) {
                      val query = Intent(Intent.ACTION_MAIN).addCategory(category)
                      for (ri in pm.queryIntentActivities(query, 0)) {
                          val pkg = ri.activityInfo.packageName
                          if (pkg == packageName || result.containsKey(pkg)) continue
                          val launch = Intent(Intent.ACTION_MAIN)
                              .addCategory(category)
                              .setClassName(pkg, ri.activityInfo.name)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          val banner = ri.activityInfo.loadBanner(pm)
                          val icon = banner ?: ri.loadIcon(pm)
                          result[pkg] = AppItem(ri.loadLabel(pm).toString(), icon, banner != null, launch)
                      }
                  }
                  return result.values.sortedBy { it.label.lowercase() }
              }

              override fun onBackPressed() {
                  // Ana ekranda geri tusu bir sey yapmasin
              }
          }

          class AppAdapter(
              private val items: List<AppItem>,
              private val onClick: (AppItem) -> Unit
          ) : RecyclerView.Adapter<AppAdapter.VH>() {

              class VH(v: View) : RecyclerView.ViewHolder(v) {
                  val icon: ImageView = v.findViewById(R.id.icon)
                  val label: TextView = v.findViewById(R.id.label)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val v = LayoutInflater.from(parent.context).inflate(R.layout.item_app, parent, false)
                  return VH(v)
              }

              override fun getItemCount() = items.size

              override fun onBindViewHolder(h: VH, position: Int) {
                  val item = items[position]
                  val density = h.itemView.resources.displayMetrics.density
                  val pad = if (item.isBanner) 0 else (20 * density).toInt()
                  h.icon.setPadding(pad, pad, pad, pad)
                  h.icon.scaleType = if (item.isBanner) ImageView.ScaleType.CENTER_CROP else ImageView.ScaleType.FIT_CENTER
                  h.icon.setImageDrawable(item.icon)
                  h.label.text = item.label
                  h.label.alpha = 0.7f
                  h.itemView.setOnClickListener { onClick(item) }
                  h.itemView.setOnFocusChangeListener { v, focused ->
                      val s = if (focused) 1.12f else 1f
                      v.animate().scaleX(s).scaleY(s).setDuration(150).start()
                      h.label.alpha = if (focused) 1f else 0.7f
                  }
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:clipChildren="false"
              android:clipToPadding="false"
              android:paddingStart="48dp"
              android:paddingEnd="48dp"
              android:paddingTop="28dp"
              android:paddingBottom="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="@string/app_name"
                      android:textColor="#FFFFFF"
                      android:textSize="26sp"
                      android:textStyle="bold" />

                  <TextClock
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:format12Hour="HH:mm"
                      android:format24Hour="HH:mm"
                      android:textColor="#CCFFFFFF"
                      android:textSize="26sp" />
              </LinearLayout>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/apps"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:layout_marginTop="24dp"
                  android:clipChildren="false"
                  android:clipToPadding="false"
                  android:padding="12dp" />
          </LinearLayout>
          EOF

          cat > app/src/main/res/layout/item_app.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:layout_margin="10dp"
              android:focusable="true"
              android:clickable="true">

              <ImageView
                  android:id="@+id/icon"
                  android:layout_width="match_parent"
                  android:layout_height="100dp"
                  android:background="@drawable/tile_bg"
                  android:clipToOutline="true"
                  android:duplicateParentState="true"
                  android:scaleType="fitCenter" />

              <TextView
                  android:id="@+id/label"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:ellipsize="end"
                  android:gravity="center"
                  android:singleLine="true"
                  android:textColor="#FFFFFF"
                  android:textSize="14sp" />
          </LinearLayout>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">TV Launcher</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@drawable/bg</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <gradient
                  android:angle="315"
                  android:startColor="#0B0F1A"
                  android:endColor="#1B2440" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/tile_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#2A3354" />
                      <stroke android:width="3dp" android:color="#FFFFFF" />
                      <corners android:radius="14dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#1E2745" />
                      <corners android:radius="14dp" />
                  </shape>
              </item>
          </selector>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path
                  android:fillColor="#1B2440"
                  android:pathData="M16,0h64a16,16 0 0 1 16,16v64a16,16 0 0 1 -16,16h-64a16,16 0 0 1 -16,-16v-64a16,16 0 0 1 16,-16z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M36,28l32,20l-32,20z" />
          </vector>
          EOF

          cat > app/src/main/res/drawable/banner.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="320dp"
              android:height="180dp"
              android:viewportWidth="320"
              android:viewportHeight="180">
              <path
                  android:fillColor="#1B2440"
                  android:pathData="M0,0h320v180h-320z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M140,60l50,30l-50,30z" />
          </vector>
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: APK bauen
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
